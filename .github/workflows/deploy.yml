name: Backend CD

on:
  workflow_run:
    workflows: [Backend CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Confirm deployment of the latest main commit after successful CI
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-deploy-main
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify main CI result
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' && inputs.confirm_deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_sha: ${{ steps.verify.outputs.deploy_sha }}
    steps:
      - name: Require successful CI for the current main commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$CI_CONCLUSION" != "success" || "$CI_BRANCH" != "main" || "$CI_SHA" != "$main_sha" ]]; then
              echo "Deployment requires a successful Backend CI run for the current main commit." >&2
              exit 1
            fi
          else
            latest_success="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"${main_sha}\" and .conclusion == \"success\") | .id" | head -n 1)"
            if [[ -z "$latest_success" ]]; then
              echo "No successful Backend CI push run exists for the current main commit." >&2
              exit 1
            fi
          fi

          echo "deploy_sha=${main_sha}" >> "$GITHUB_OUTPUT"
          echo "CI authorization passed for the current main commit."

  deploy:
    name: Deploy to AWS EC2
    if: vars.DEPLOY_ENABLED == 'true'
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check required deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SYSTEMD_SERVICE: ${{ vars.SYSTEMD_SERVICE }}
          HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in EC2_HOST EC2_USER EC2_SSH_PORT EC2_SSH_PRIVATE_KEY EC2_KNOWN_HOSTS DEPLOY_PATH SYSTEMD_SERVICE HEALTH_CHECK_URL; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Deployment configuration is incomplete; missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "EC2_HOST must be a DNS name or IPv4 address." >&2; exit 1; }
          [[ "$EC2_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "EC2_USER contains unsupported characters." >&2; exit 1; }
          [[ "$EC2_SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( 10#$EC2_SSH_PORT <= 65535 )) || { echo "EC2_SSH_PORT must be between 1 and 65535." >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ && "$DEPLOY_PATH" != *".."* ]] || { echo "DEPLOY_PATH must be a safe absolute path." >&2; exit 1; }
          [[ "$SYSTEMD_SERVICE" =~ ^[A-Za-z0-9_.@-]+$ ]] || { echo "SYSTEMD_SERVICE contains unsupported characters." >&2; exit 1; }
          [[ "$HEALTH_CHECK_URL" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9_./-]*)?$ ]] || { echo "HEALTH_CHECK_URL must be an HTTP(S) URL without query parameters." >&2; exit 1; }

      - name: Check out the CI-approved main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.deploy_sha }}
          persist-credentials: false

      - name: Prepare SSH key, pinned host keys, and release archive
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ needs.authorize.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ec2_deploy_key"
          known_hosts_file="$RUNNER_TEMP/ec2_known_hosts"
          archive="$RUNNER_TEMP/backend-${DEPLOY_SHA}.tar.gz"
          umask 077
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          printf 'SSH_KEY_FILE=%s\nKNOWN_HOSTS_FILE=%s\nRELEASE_ARCHIVE=%s\n' \
            "$key_file" "$known_hosts_file" "$archive" >> "$GITHUB_ENV"

          tar -czf "$archive" \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude='.env.*' \
            --exclude=.venv \
            --exclude=venv \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            --exclude=.ruff_cache \
            --exclude=tests \
            --exclude=auth.db \
            --exclude='*.db' \
            --exclude='*.sqlite3' \
            --exclude='*.pyc' \
            -C "$GITHUB_WORKSPACE" .

      - name: Copy release archive to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          set -euo pipefail
          release_path="/tmp/awsback-${{ needs.authorize.outputs.deploy_sha }}.tar.gz"
          scp \
            -i "$SSH_KEY_FILE" \
            -P "$EC2_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" \
            "$RELEASE_ARCHIVE" "$EC2_USER@$EC2_HOST:$release_path"

      - name: Install dependencies, restart service, and check health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SYSTEMD_SERVICE: ${{ vars.SYSTEMD_SERVICE }}
          HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}
          DEPLOY_SHA: ${{ needs.authorize.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          ssh \
            -i "$SSH_KEY_FILE" \
            -p "$EC2_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$SYSTEMD_SERVICE' '$HEALTH_CHECK_URL' '$DEPLOY_SHA'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          deploy_path="$1"
          service_name="$2"
          health_url="$3"
          release_sha="$4"
          archive="/tmp/awsback-${release_sha}.tar.gz"

          mkdir -p -- "$deploy_path"
          tar -xzf "$archive" -C "$deploy_path"
          rm -f -- "$archive"

          python3 -m venv "$deploy_path/.venv"
          "$deploy_path/.venv/bin/python" -m pip install --upgrade pip
          "$deploy_path/.venv/bin/python" -m pip install --upgrade -r "$deploy_path/requirements.txt"

          sudo systemctl restart "$service_name"
          sudo systemctl is-active --quiet "$service_name"

          for attempt in {1..12}; do
            if curl --fail --silent --max-time 5 "$health_url" >/dev/null; then
              echo "Deployment health check passed."
              exit 0
            fi
            sleep 5
          done

          echo "Deployment health check failed." >&2
          exit 1
          REMOTE_SCRIPT
