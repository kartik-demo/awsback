name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Syntax, lint, tests, and import
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend, test, and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py tests

      - name: Run Ruff code quality checks
        run: python -m ruff check --select E4,E7,E9,F main.py tests

      - name: Validate FastAPI application import
        run: >-
          python -c "import os,secrets; os.environ['DATABASE_URL']='sqlite:///:memory:';
          os.environ['JWT_SECRET']=secrets.token_urlsafe(48);
          import main; assert main.app; print('FastAPI application import succeeded.')"

      - name: Run automated tests
        run: python -m pytest -q

      - name: Report CI success
        if: success()
        run: |
          echo "Backend CI passed: syntax, Ruff, application import, and pytest."

      - name: Report CI failure
        if: failure()
        run: |
          echo "::error title=Backend CI failed::Review the failed syntax, lint, import, or test step."
